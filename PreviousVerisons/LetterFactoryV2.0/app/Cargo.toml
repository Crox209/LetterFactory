[package]
name = "letterfactory"
version = "1.0.0"
edition = "2021"
description = "Generate personalized .docx documents from a template using [[Placeholders]]"
authors = ["Ethan Silvio"]

[[bin]]
name = "LetterFactory"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[dependencies]
anyhow = "1.0.103"
calamine = { version = "0.35.0", features = ["dates"] }
chrono = "0.4.45"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = "0.35.0"
image = "0.25.10"
quick-xml = "0.40.1"
regex = "1.12.4"
rfd = "0.17.2"
zip = "8.6.0"

[build-dependencies]
embed-resource = "3.0.9"
